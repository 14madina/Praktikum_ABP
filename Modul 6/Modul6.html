<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Menunaikan Ibadah Puasa</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .container-main {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            opacity: 0.8;
        }

        .btn-thr {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            background: linear-gradient(45deg, #f7971e, #ffd200);
            border: none;
            color: #000;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(255, 210, 0, 0.5);
        }

        .btn-thr:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 210, 0, 0.8);
        }

        /* FIX: warna teks modal */
        .modal-content {
            color: #000;
            /* biar teks kelihatan */
        }

        .moon {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #fff, #ddd);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            pointer-events: none;
            /* supaya tidak ganggu klik */
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.3;
            pointer-events: none;
            /* supaya tidak menutupi klik */
        }
    </style>
</head>

<body>

    <div class="stars"></div>
    <div class="moon"></div>

    <div class="container-main">
        <h1>🌙 Selamat Menunaikan Ibadah Puasa</h1>
        <p>Semoga berkah dan kebahagiaan menyertai Anda</p>

        <button class="btn btn-thr" onclick="showTHR()">Klik untuk THR 🎁</button>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="thrModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-header">
                    <h5 class="modal-title">🎉 Selamat!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <h2 style="font-weight:600;">🎉 Selamat 🎉</h2>
                    <p style="font-size:18px; margin-bottom:15px;">Anda mendapatkan THR Spesial Ramadhan</p>
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135706.png" alt="uang"
                        style="width:140px; margin:10px 0;">
                </div>
                <div class="modal-footer justify-content-center">
                    <button class="btn btn-success" data-bs-dismiss="modal">Alhamdulillah</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function showTHR() {
            let modal = new bootstrap.Modal(document.getElementById('thrModal'));
            modal.show();
        }
    </script>

</body>

</html>
